<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 연습 03</title>
    <style>
        div {
            border: 1px solid gray;
            border-radius: 5px;
            width: 1000px;
            height: 300px;
        }
        img {
            float: left;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>아름다운 장미</h2>
        
        <img src="img/rose.jpg" width="200">
        <p>
            장미는 사람들이 좋아하는 꽃입니다. 
            장미는 5월의 여왕이라 불리는 꽃입니다. 
            장미는 빨간 장미와 검은 장미가 유명합니다. 
        </p>
    </div>
</body>
</html>
