<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style15.css">
    <title>css 연습-블록 요소와 인라인 요소</title>
</head>
<body>
    <p>블록 요소 태그는 자동 줄바꿈이 된다.</p>
    <p>
        <span>
            <strong>인라인 요소 태그</strong>들은 <em>좌우로</em> 배치된다.
        </span>
        <span>
            이 문장은 span으로 감싼 문장이다.
        </span>
    </p>
</body>
